<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Criar post</title>
		<style>
			:root {
				font-family: Georgia, serif;
				color: #20211f;
				background: #eee9df;
				line-height: 1.5;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
			}
			.shell {
				max-width: 980px;
				margin: 0 auto;
				padding: 48px 20px 72px;
			}
			.eyebrow {
				font:
					700 12px/1.2 Arial,
					sans-serif;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: #a3482c;
			}
			.layout {
				display: grid;
				grid-template-columns: minmax(0, 1fr) 300px;
				gap: 28px;
				align-items: start;
			}
			h1 {
				font-size: clamp(2.4rem, 6vw, 5rem);
				line-height: 0.95;
				font-weight: 400;
				margin: 10px 0 36px;
				max-width: 720px;
			}
			h2 {
				font-size: 1.2rem;
				font-weight: 400;
				margin: 0 0 18px;
			}
			form,
			.panel {
				background: #f8f5ee;
				border: 1px solid #d7cfc1;
				padding: 24px;
				box-shadow: 8px 8px 0 #d7cfc1;
			}
			label {
				display: block;
				font:
					700 12px/1.2 Arial,
					sans-serif;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				margin: 0 0 7px;
				color: #55564f;
			}
			input,
			textarea {
				width: 100%;
				border: 1px solid #bbb4a8;
				background: #fffdf8;
				padding: 11px 12px;
				font: inherit;
				color: inherit;
				margin-bottom: 18px;
			}
			textarea {
				min-height: 110px;
				resize: vertical;
			}
			#content {
				min-height: 360px;
				font-family: monospace;
				font-size: 14px;
			}
			small,
			.hint {
				color: #6b6b63;
				font:
					13px/1.4 Arial,
					sans-serif;
			}
			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
				margin-top: 6px;
			}
			button {
				border: 0;
				background: #a3482c;
				color: #fffdf8;
				padding: 12px 16px;
				font:
					700 12px Arial,
					sans-serif;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				cursor: pointer;
			}
			button.secondary {
				background: #315c59;
			}
			button.tertiary {
				background: #55564f;
			}
			button:disabled {
				opacity: 0.45;
				cursor: not-allowed;
			}
			.panel {
				position: sticky;
				top: 20px;
			}
			.status {
				white-space: pre-wrap;
				word-break: break-word;
				background: #20211f;
				color: #f8f5ee;
				padding: 14px;
				font: 12px/1.5 monospace;
				min-height: 100px;
				margin-top: 14px;
			}
			.status.success {
				border-left: 4px solid #8caf78;
			}
			.status.error {
				border-left: 4px solid #c96c4f;
			}
			.file-list {
				font: 12px/1.5 monospace;
				padding-left: 18px;
			}
			.divider {
				height: 1px;
				background: #d7cfc1;
				margin: 24px 0;
			}
			@media (max-width: 760px) {
				.layout {
					grid-template-columns: 1fr;
				}
				.panel {
					position: static;
				}
				h1 {
					font-size: 3.2rem;
				}
			}
		</style>
	</head>
	<body>
		<main class="shell">
			<h1>Novo post</h1>
			<div class="layout">
				<form id="post-form">
					<label for="title">Título</label><input id="title" name="title" required />

					<label for="slug">Slug</label><input id="slug" name="slug" required />

					<label for="current-date">Data de publicação</label><input id="current-date" type="text" readonly />

					<label for="categories">Categorias</label
					><input id="categories" name="categories" placeholder="JavaScript, Backend" required />

					<label for="cover">Imagem de capa</label
					><input
						id="cover"
						name="cover"
						type="file"
						accept="image/png,image/jpeg,image/gif,image/webp"
						required
					/>

					<label for="content">Conteúdo MDX</label
					><textarea
						id="content"
						name="content"
						placeholder="Escreva o conteúdo em MDX..."
						required
					></textarea>

					<label for="preview">Preview</label><textarea id="preview" name="preview" required></textarea>

					<div class="actions"><button type="submit" id="save">Salvar e validar</button></div>
				</form>
				<aside class="panel">
					<label for="commit-message">Mensagem do commit</label
					><input id="commit-message" value="content(post): " />
					<div class="actions">
						<button class="secondary" id="commit" disabled>Criar commit</button
						><button class="tertiary" id="push" disabled>Fazer push</button>
					</div>
					<div id="status" class="status">Aguardando um post.</div>
				</aside>
			</div>
		</main>
		<script>
			const form = document.querySelector('#post-form');
			const title = document.querySelector('#title');
			const slug = document.querySelector('#slug');
			const cover = document.querySelector('#cover');
			const statusBox = document.querySelector('#status');
			const saveButton = document.querySelector('#save');
			const commitButton = document.querySelector('#commit');
			const pushButton = document.querySelector('#push');
			let coverData = '';
			let valid = false;
			function show(message, success = false) {
				statusBox.textContent = message;
				statusBox.className = `status ${success ? 'success' : 'error'}`;
			}
			function slugify(value) {
				return value
					.normalize('NFD')
					.replace(/[\u0300-\u036f]/g, '')
					.toLowerCase()
					.replace(/[^a-z0-9]+/g, '-')
					.replace(/^-+|-+$/g, '')
					.slice(0, 100);
			}
			title.addEventListener('input', () => {
				if (!slug.dataset.edited) slug.value = slugify(title.value);
			});
			slug.addEventListener('input', () => {
				slug.dataset.edited = 'true';
			});
			cover.addEventListener('change', () => {
				const file = cover.files[0];
				if (!file) {
					coverData = '';
					return;
				}
				if (file.size > 8 * 1024 * 1024) {
					show('A imagem excede o limite de 8 MB.');
					cover.value = '';
					return;
				}
				const reader = new FileReader();
				reader.onload = () => {
					coverData = reader.result;
				};
				reader.readAsDataURL(file);
			});
			function updateCurrentDate() {
				document.querySelector('#current-date').value = new Intl.DateTimeFormat('pt-BR', {
					dateStyle: 'short',
					timeStyle: 'medium',
				}).format(new Date());
			}
			updateCurrentDate();
			setInterval(updateCurrentDate, 1000);
			async function request(path, options = {}) {
				const response = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
				const data = await response.json();
				if (!response.ok || data.error) throw new Error(data.error || 'A operação falhou.');
				return data;
			}
			form.addEventListener('submit', async (event) => {
				event.preventDefault();
				valid = false;
				commitButton.disabled = true;
				pushButton.disabled = true;
				saveButton.disabled = true;
				show('Gerando arquivos com a data atual e executando lint/build...');
				try {
					if (!coverData) throw new Error('Selecione uma imagem de capa.');
					const data = await request('/api/create', {
						method: 'POST',
						body: JSON.stringify({
							title: title.value,
							slug: slug.value,
							preview: document.querySelector('#preview').value,
							categories: document.querySelector('#categories').value,
							cover: coverData,
							content: document.querySelector('#content').value,
						}),
					});
					valid = data.ok;
					if (!data.ok) throw new Error(`${data.validation.step} falhou:\n${data.validation.output}`);
					show(`Arquivos criados:\n${data.files.join('\n')}\n\nValidação concluída.`, true);
					commitButton.disabled = false;
				} catch (error) {
					show(error.message);
				} finally {
					saveButton.disabled = false;
				}
			});
			commitButton.addEventListener('click', async () => {
				commitButton.disabled = true;
				try {
					const data = await request('/api/commit', {
						method: 'POST',
						body: JSON.stringify({ message: document.querySelector('#commit-message').value }),
					});
					show(`Commit criado.\n${data.output}`, true);
					pushButton.disabled = false;
				} catch (error) {
					show(error.message);
					commitButton.disabled = false;
				}
			});
			pushButton.addEventListener('click', async () => {
				pushButton.disabled = true;
				try {
					const data = await request('/api/push', { method: 'POST' });
					show(data.output, true);
				} catch (error) {
					show(error.message);
					pushButton.disabled = false;
				}
			});
			request('/api/status')
				.then((data) => {
					if (data.output) show(`Git atual:\n${data.output}`, true);
				})
				.catch((error) => show(error.message));
		</script>
	</body>
</html>
